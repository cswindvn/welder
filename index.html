<title>Welder Qualification Verification</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f3f5f8; --surface: #ffffff; --text: #14202e; --muted: #5a6877; --line: #d9dfe7;
  --brand: #0b4f8a; --brand-text: #ffffff;
  --ok: #17692f; --ok-bg: #e3f4e8;
  --warn: #8a5a00; --warn-bg: #fff2cf;
  --bad: #a6231b; --bad-bg: #fde6e4;
  --neutral: #4a5766; --neutral-bg: #e8ecf1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1620; --surface: #18222f; --text: #e9eef4; --muted: #a2afbd; --line: #2c3a4b;
    --brand: #6db2ee; --brand-text: #0b1a2a;
    --ok: #7fdc99; --ok-bg: #163a24;
    --warn: #f2c15c; --warn-bg: #3d2f0c;
    --bad: #ff9d96; --bad-bg: #44201d;
    --neutral: #b5c0cc; --neutral-bg: #26323f;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 32px; }
header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 0 10px;
}
.brand { font-weight: 700; letter-spacing: .02em; color: var(--brand); }
.brand small { display: block; font-weight: 500; color: var(--muted); letter-spacing: 0; font-size: 13px; }
button, input { font: inherit; }
.lang {
  min-height: 44px; padding: 0 14px; border-radius: 22px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
}
h1.page-title { font-size: 18px; margin: 4px 0 14px; color: var(--muted); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.panel.head { display: flex; gap: 14px; align-items: center; }
.head-info { min-width: 0; }
.photo {
  flex: 0 0 84px; width: 84px; height: 112px; border-radius: 10px; overflow: hidden;
  background: var(--neutral-bg); color: var(--muted); display: flex; align-items: center; justify-content: center;
}
.photo .ph { width: 44px; height: 58px; }
.photo-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.welder-name { font-size: 24px; line-height: 1.2; margin: 0 0 6px; overflow-wrap: anywhere; }
.chip {
  display: inline-block; padding: 2px 10px; border-radius: 12px; font-weight: 600;
  background: var(--neutral-bg); color: var(--neutral); font-size: 14px;
}
.summary { margin: 12px 0 0; color: var(--muted); font-size: 15px; }
.cards { display: grid; gap: 12px; margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left-width: 8px; border-radius: 14px; padding: 14px 16px; }
.card.s-valid { border-left-color: var(--ok); }
.card.s-expired, .card.s-notStarted { border-left-color: var(--bad); }
.card.s-unknown { border-left-color: var(--neutral); }
.badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 20px;
  font-weight: 700; font-size: 16px;
}
.badge .ico { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; background: currentColor; }
.badge .ico span { color: var(--surface); line-height: 1; }
.s-valid .badge { color: var(--ok); background: var(--ok-bg); }
.s-expired .badge, .s-notStarted .badge { color: var(--bad); background: var(--bad-bg); }
.s-unknown .badge { color: var(--neutral); background: var(--neutral-bg); }
.process { font-size: 22px; margin: 10px 0 8px; }
dl { display: grid; grid-template-columns: 1fr; gap: 8px 12px; margin: 0; }
dl div { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
dt { color: var(--muted); }
dd { margin: 0; font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.message { text-align: center; padding: 24px 16px; }
.message h2 { margin: 0 0 8px; font-size: 20px; }
.message p { margin: 0 0 14px; color: var(--muted); }
.spinner { width: 34px; height: 34px; margin: 0 auto 10px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--brand); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
form.lookup { margin-top: 18px; }
form.lookup label { display: block; font-weight: 600; margin-bottom: 6px; }
.row { display: flex; gap: 8px; }
input[type=text] {
  flex: 1; min-width: 0; min-height: 48px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text); text-transform: uppercase;
}
.btn {
  min-height: 48px; padding: 0 18px; border-radius: 10px; border: 0; cursor: pointer;
  background: var(--brand); color: var(--brand-text); font-weight: 700;
}
.btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
.hint { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
footer { margin-top: 22px; color: var(--muted); font-size: 13px; }
footer p { margin: 4px 0; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
details.legend { margin-top: 14px; }
details.legend summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
details.legend h3 { font-size: 15px; margin: 12px 0 6px; }
table.legend-table { width: 100%; border-collapse: collapse; font-size: 14px; }
table.legend-table th, table.legend-table td { text-align: left; padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: top; }
table.legend-table th { white-space: nowrap; width: 5.5em; }
[hidden] { display: none !important; }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand">CS Wind Vietnam<small data-i18n="appTitle">Welder Qualification Verification</small></div>
    <select id="langSel" class="lang" aria-label="Language / Ngôn ngữ / 语言 / 언어">
      <option value="en">English</option>
      <option value="vi">Tiếng Việt</option>
      <option value="zh">简体中文</option>
      <option value="ko">한국어</option>

  <main id="main" aria-live="polite">
    <section id="viewLoading" class="panel message" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p data-i18n="loading">Loading…</p>
    </section>
    <section id="viewMessage" class="panel message" hidden>
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button id="retryBtn" class="btn" type="button" hidden></button>
    </section>
    <section id="viewResult" hidden></section>
  </main>

  <form id="lookupForm" class="lookup" autocomplete="off" novalidate>
    <label for="welderId" id="lookupLabel" data-i18n="lookupLabel">Welder ID</label>
    <div class="row">
      <input id="welderId" type="text" maxlength="20" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button class="btn" type="submit" data-i18n="lookupButton">Check</button>
    </div>
    <p class="hint" data-i18n="lookupHint">Enter the Welder ID printed on the helmet.</p>
  </form>

  <footer>
    <p id="checkedOn"></p>
    <p data-i18n="footer">Data is refreshed once a day from the company's official welder register. For verification purposes only.</p>
  </footer>
</div>

  // <status-logic>
  // Pure functions (no DOM): they are unit-tested by tests/public_page/status_logic.test.js
  function isIsoDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
    if (!m) { return false; }
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return d.getUTCFullYear() === +m[1] && d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3];
  }

  // Status of one qualification on the given calendar day (yyyy-MM-dd, Vietnam time). Only TestDate and ExpiryDate count:
  // valid: TestDate <= today <= ExpiryDate (the expiry day itself is still valid)
  // expired: today is after ExpiryDate; notStarted: today is before TestDate; unknown: missing/invalid dates.
  function computeStatus(q, today) {
    if (!q || !isIsoDate(q.testDate) || !isIsoDate(q.expiryDate) || !isIsoDate(today)) { return 'unknown'; }
    if (q.expiryDate < q.testDate) { return 'unknown'; }
    if (today < q.testDate) { return 'notStarted'; }
    if (today > q.expiryDate) { return 'expired'; }
    return 'valid';
  }
  function isCurrentlyValid(status) { return status === 'valid'; }
  function summarize(quals, today) {
    var n = 0;
    for (var i = 0; i < quals.length; i++) { if (isCurrentlyValid(computeStatus(quals[i], today))) { n++; } }

    if (cls) { n.className = cls; }
    if (text !== undefined) { n.textContent = text; }
    return n;
  }
  function clear(n) { while (n.firstChild) { n.removeChild(n.firstChild); } }

  function renderStatic() {
    document.documentElement.lang = HTML_LANG[lang] || 'en';
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) { nodes[i].textContent = t(nodes[i].getAttribute('data-i18n')); }
    el.input.setAttribute('placeholder', t('placeholder'));
    el.langSel.value = lang;
    document.title = t('appTitle');
    el.checkedOn.textContent = t('checkedOn').replace('{date}', formatDate(todayInVietnam(), lang));
  }

  function renderView() {
    el.loading.hidden = state.view !== 'loading';
    el.message.hidden = state.view !== 'message';
    el.result.hidden = state.view !== 'result';
    if (state.view === 'message') {
      el.msgTitle.textContent = t(state.titleKey);
      el.msgText.textContent = t(state.textKey);
      el.retry.hidden = !state.retry;
      el.retry.textContent = t('retry');
    }
    if (state.view === 'result') { renderResult(state.welder); }
  }

  function addRow(dl, label, value) {
    var row = h('div');
    row.appendChild(h('dt', null, label));
    row.appendChild(h('dd', null, value));
    dl.appendChild(row);
  }

  // Portrait box: a neutral silhouette until photos/<WelderID>.jpg loads; stays a silhouette if there is no photo.
  function buildPhoto(welderId, hint) {
    var box = h('div', 'photo');
    var ns = 'http://www.w3.org/2000/svg';
    var ph = document.createElementNS(ns, 'svg');
    ph.setAttribute('viewBox', '0 0 24 32'); ph.setAttribute('class', 'ph'); ph.setAttribute('aria-hidden', 'true');
    var head = document.createElementNS(ns, 'circle');
    head.setAttribute('cx', '12'); head.setAttribute('cy', '10'); head.setAttribute('r', '5'); head.setAttribute('fill', 'currentColor');
    var body = document.createElementNS(ns, 'path');
    body.setAttribute('d', 'M3 30c0-6 4-10 9-10s9 4 9 10z'); body.setAttribute('fill', 'currentColor');
    ph.appendChild(head); ph.appendChild(body);
    box.appendChild(ph);
    var img = document.createElement('img');
    img.className = 'photo-img'; img.alt = t('photoAlt'); img.hidden = true; img.decoding = 'async';
    img.onload = function () { img.hidden = false; ph.style.display = 'none'; hint.hidden = false; };
    img.onerror = function () { img.remove(); };
    box.appendChild(img);
    img.src = PHOTO_DIR + encodeURIComponent(welderId) + '.jpg';
    return box;
  }

  function renderResult(w) {
    clear(el.result);
    var today = todayInVietnam();
    var head = h('section', 'panel head');
    var info = h('div', 'head-info');
    var hint = h('p', 'photo-hint', t('photoHint'));
    hint.hidden = true;
    head.appendChild(buildPhoto(w.welderId, hint));
    info.appendChild(h('h2', 'welder-name', w.welderName));
    info.appendChild(h('span', 'chip', t('welderId') + ': ' + w.welderId));
    var sum = summarize(w.qualifications, today);
    info.appendChild(h('p', 'summary', t('summary').replace('{n}', sum.valid).replace('{m}', sum.total)));
    info.appendChild(hint);
    head.appendChild(info);
    el.result.appendChild(head);

    var list = h('div', 'cards');
    var icons = { valid: '✔', expired: '✖', notStarted: '✖', unknown: '?' };
    w.qualifications.forEach(function (q) {
      var s = computeStatus(q, today);
      var card = h('article', 'card s-' + s);
      var badge = h('span', 'badge');
      var ico = h('span', 'ico'); ico.setAttribute('aria-hidden', 'true');
      ico.appendChild(h('span', null, icons[s]));
      badge.appendChild(ico);
      badge.appendChild(h('span', null, t(s)));
      card.appendChild(badge);
      card.appendChild(h('h3', 'process', q.weldingProcess + ' · ' + q.weldingProcessCode));
      var dl = h('dl');
      addRow(dl, t('standard'), q.standard);
      var wk = weldTypeKey(q.qualifiedType);
      addRow(dl, t('weldType'), wk ? t(wk) : q.qualifiedType);
      addRow(dl, t('testDate'), formatDate(q.testDate, lang));
      addRow(dl, t('expiry'), formatDate(q.expiryDate, lang));
      addRow(dl, t('baseMaterial'), rangeText(q.qualifiedBaseMaterial, t));
      addRow(dl, t('fillerMaterial'), rangeText(q.qualifiedFillerMaterial, t));
      addRow(dl, t('thickness'), rangeText(q.qualifiedRangeThickness, t));
      addRow(dl, t('position'), rangeText(q.qualifiedTestPosition, t));
      card.appendChild(dl);
      list.appendChild(card);
    });
    el.result.appendChild(list);
    el.result.appendChild(buildLegend());
  }

  function legendTable(rows) {
    var table = h('table', 'legend-table');
    rows.forEach(function (r) {
      var tr = h('tr');
      tr.appendChild(h('th', null, r[0]));
      tr.appendChild(h('td', null, r[1]));
      table.appendChild(tr);
    });
    return table;
  }

  function buildLegend() {
    var box = h('details', 'panel legend');
    box.appendChild(h('summary', null, t('legendTitle')));
    box.appendChild(h('h3', null, t('legendPositions')));
    box.appendChild(legendTable(LEGEND_POSITIONS));
    box.appendChild(h('h3', null, t('legendFiller')));
    box.appendChild(legendTable(LEGEND_FILLER[lang] || LEGEND_FILLER.en));
    return box;
  }

  function showMessage(titleKey, textKey, retry) {
    state = { view: 'message', titleKey: titleKey, textKey: textKey, retry: !!retry };
    renderView();
  }

  // ---- API ----------------------------------------------------------------
  function str(x, max) { return typeof x === 'string' && x.length <= (max || 200); }
  function optStr(x, max) { return x === undefined || x === null || str(x, max); }
  function validateResponse(json, id) {
    if (!json || typeof json !== 'object' || typeof json.ok !== 'boolean') { return { kind: 'error' }; }
    if (!json.ok) {
      if (json.error === 'Welder not found.') { return { kind: 'notFound' }; }
      if (json.error === 'Invalid WelderID format.') { return { kind: 'invalid' }; }
      return { kind: 'error' };
    }
    var w = json.welder;
    if (!w || !str(w.welderId, 30) || w.welderId !== id || !str(w.welderName) || !Array.isArray(w.qualifications) || w.qualifications.length === 0 || w.qualifications.length > 50) {
      return { kind: 'error' };
    }
    var quals = [];
    for (var i = 0; i < w.qualifications.length; i++) {
      var q = w.qualifications[i];
      if (!q || !str(q.standard) || !str(q.weldingProcess) || !str(q.weldingProcessCode, 10) || !str(q.qualifiedType, 10) ||
          !str(q.expiryDate, 10) || !optStr(q.testDate, 10) || !optStr(q.qualifiedBaseMaterial) || !optStr(q.qualifiedFillerMaterial) ||
          !optStr(q.qualifiedRangeThickness) || !optStr(q.qualifiedTestPosition)) { return { kind: 'error' }; }
      quals.push({ standard: q.standard, weldingProcess: q.weldingProcess, weldingProcessCode: q.weldingProcessCode,
        qualifiedType: q.qualifiedType, testDate: q.testDate || '', expiryDate: q.expiryDate,
        qualifiedBaseMaterial: q.qualifiedBaseMaterial || '', qualifiedFillerMaterial: q.qualifiedFillerMaterial || '',
        qualifiedRangeThickness: q.qualifiedRangeThickness || '', qualifiedTestPosition: q.qualifiedTestPosition || '' });
    }
    return { kind: 'ok', welder: { welderId: w.welderId, welderName: w.welderName, qualifications: quals } };
  }

  function lookup(id) {
    lastId = id;
    var seq = ++requestSeq;
    state = { view: 'loading' };
    renderView();
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) { ctrl.abort(); } }, REQUEST_TIMEOUT_MS);
    fetch(API_URL + '?id=' + encodeURIComponent(id), {
      cache: 'no-store', redirect: 'follow', referrerPolicy: 'no-referrer', signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      if (!res.ok) { throw new Error('http'); }
      return res.json();
    }).then(function (json) {
      if (seq !== requestSeq) { return; }
      var v = validateResponse(json, id);
      if (v.kind === 'ok') { state = { view: 'result', welder: v.welder }; renderView(); }
      else if (v.kind === 'notFound') { showMessage('notFoundTitle', 'notFoundText', false); }
      else if (v.kind === 'invalid') { showMessage('invalidTitle', 'invalidText', false); }
      else { showMessage('errorTitle', 'errorText', true); }
    }).catch(function () {
      if (seq !== requestSeq) { return; }
      showMessage('errorTitle', 'errorText', true);
    }).then(function () { clearTimeout(timer); });
  }

  function submitId(raw, pushToUrl) {
    var id = String(raw || '').trim().toUpperCase();
    el.input.value = id;
    if (id === '') { state = { view: 'form' }; renderView(); return; }
    if (!ID_PATTERN.test(id)) { requestSeq++; showMessage('invalidTitle', 'invalidText', false); return; }
    if (pushToUrl && window.history && history.replaceState) {
      try { history.replaceState(null, '', '?id=' + encodeURIComponent(id)); } catch (e) { /* ignore */ }
    }
    lookup(id);
  }

  // ---- events and start-up ---------------------------------------------------
  el.form.addEventListener('submit', function (ev) { ev.preventDefault(); submitId(el.input.value, true); });
  el.retry.addEventListener('click', function () { if (lastId) { lookup(lastId); } });
  el.langSel.addEventListener('change', function () {
    lang = LANGS.indexOf(el.langSel.value) !== -1 ? el.langSel.value : 'en';
    try { localStorage.setItem('wv-lang', lang); } catch (e) { /* storage may be unavailable */ }
    renderStatic();
    renderView();
  });

  (function init() {
    var params = new URLSearchParams(window.location.search);
    var wanted = params.get('lang');
    var saved = null;
    try { saved = localStorage.getItem('wv-lang'); } catch (e) { /* ignore */ }
    var nav = (navigator.language || '').toLowerCase();
    var fromNav = 'en';
    for (var k = 0; k < LANGS.length; k++) { if (nav.indexOf(LANGS[k]) === 0) { fromNav = LANGS[k]; } }
    lang = LANGS.indexOf(wanted) !== -1 ? wanted : (LANGS.indexOf(saved) !== -1 ? saved : fromNav);
    renderStatic();
    var id = params.get('id');
    if (id) { submitId(id, false); } else { state = { view: 'form' }; renderView(); }
  })();
})();
</script>
</body>
</html>
